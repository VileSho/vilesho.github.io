<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoshana Abernethy | Cybersecurity, OSINT &amp; Threat Detection</title>
  <meta name="description" content="Professional cybersecurity portfolio of Shoshana Abernethy — U.S. Army CBRN NCO Veteran, OSINT Investigator, Linux Homelab Architect, and Python/Shell Developer." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #111822;
      --bg-card: #151e2b;
      --bg-terminal: #070a0e;
      --border: #233044;
      --border-highlight: #10b981;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    a:hover {
      color: var(--accent-green);
    }

    /* Top Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 14, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span.prompt {
      color: var(--accent-green);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    nav a {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    nav a:hover {
      color: var(--accent-green);
    }

    /* Layout Container */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 4.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .section-header {
      margin-bottom: 2.5rem;
    }

    .section-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-green);
      display: block;
      margin-bottom: 0.4rem;
    }

    .section-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Hero Section */
    .hero {
      padding: 5.5rem 0 4.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero h2 {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 500;
      color: var(--accent-cyan);
      margin-bottom: 1.5rem;
    }

    .hero p {
      max-width: 780px;
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.75rem 1.35rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #04130d;
      border: 1px solid var(--accent-green);
    }

    .btn-primary:hover {
      background-color: #0ea572;
      color: #04130d;
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      transition: border-color 0.2s ease, transform 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      border-color: rgba(6, 182, 212, 0.5);
    }

    .card-header {
      margin-bottom: 1rem;
    }

    .card-kicker {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
      display: block;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .card ul {
      list-style: none;
      margin-bottom: 1.25rem;
    }

    .card ul li {
      position: relative;
      padding-left: 1.25rem;
      margin-bottom: 0.55rem;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .card ul li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    /* Tags / Badges */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
    }

    /* Case Study Highlight Box */
    .case-study-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 2rem;
      margin-top: 2rem;
    }

    .terminal-block {
      background-color: var(--bg-terminal);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-main);
      overflow-x: auto;
      margin: 1.25rem 0;
      line-height: 1.55;
    }

    .terminal-block .cmd { color: var(--accent-green); }
    .terminal-block .warn { color: var(--accent-amber); }
    .terminal-block .err { color: var(--accent-red); }
    .terminal-block .muted { color: var(--text-muted); }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 1.25rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--accent-cyan);
      background-color: rgba(255, 255, 255, 0.02);
    }

    td {
      color: var(--text-muted);
    }

    td strong {
      color: var(--text-main);
    }

    /* Timeline / Experience */
    .timeline-item {
      padding: 1.5rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .timeline-role {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .timeline-org {
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }

    .timeline-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .timeline-item ul {
      list-style: none;
    }

    .timeline-item ul li {
      position: relative;
      padding-left: 1.25rem;
      margin-bottom: 0.45rem;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .timeline-item ul li::before {
      content: "›";
      position: absolute;
      left: 0;
      color: var(--accent-green);
      font-weight: bold;
    }

    /* Credential Verification Rows */
    .cert-entry {
      padding: 0.85rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .cert-entry:last-child {
      margin-bottom: 0;
    }

    .cert-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
